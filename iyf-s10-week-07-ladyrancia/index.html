<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Refactored To-Do List - Week 7</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="container">
            <h2>My To-Do List</h2>
            <p class="subtitle">
                Persistent state with localStorage & modular architecture
            </p>

            <div class="stats">
                <span>Total: <b id="total">0</b></span>
                <span>Active: <b id="active">0</b></span>
                <span>Completed: <b id="completed">0</b></span>
            </div>

            <div class="input-group">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Add a new task"
                    autocomplete="off"
                />
                <button id="addBtn">Add Task</button>
            </div>

            <div class="filters">
                <button data-filter="all" class="active">ALL</button>
                <button data-filter="active">ACTIVE</button>
                <button data-filter="completed">COMPLETED</button>
            </div>

            <div id="taskList"></div>

            <button id="clearAllBtn" class="clear-btn">Clear All</button>
        </div>

        <script type="module" src="js/app.js"></script>
    </body>
</html>
